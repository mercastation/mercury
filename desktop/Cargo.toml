# Mercury's desktop window, drawn natively with Rune (github.com/anomalyco/rune)
# instead of a web page inside Electron. A trial: one screen, to see whether the
# look survives the move (w-4c6fedcd6c).
[package]
name = "mercury-desktop"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "mercury"
path = "src/main.rs"

# Its own workspace: nothing above this folder is Rust.
[workspace]

[dependencies]
# Rune is pre-release: pin a revision of `dev`, and use the same one for every patch below.
# The paper clip opens the system's file picker, which Rune shows only with this feature on.
rune = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347", features = ["native-file-dialog"] }
# The engine's door speaks JSON over plain HTTP on 127.0.0.1, so no TLS is built in.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }
# The title and status rules are regex tables in the web app; a conversation's words are markdown.
regex = "1"
# Some of those tables look ahead or behind a match, which `regex` alone refuses.
fancy-regex = "0.19"
pulldown-cmark = { version = "0.12", default-features = false }
# A picture a message names is decoded here, off the main thread, and shrunk to the size it is
# drawn at before Rune sees it (`src/pictures.rs`). Rune's own image cache keeps every picture
# whole. The same crate and codecs Rune already builds, so this adds nothing to compile.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# A pasted picture is sent to the engine as its bytes in base64, as the web window sends it.
# Already built for Rune, so this adds nothing to compile.
base64 = "0.22"

# Cargo does not inherit a dependency's patches, and Rune's README asks an app to repeat them.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }
